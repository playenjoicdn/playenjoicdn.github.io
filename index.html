<!-- ================= VIDEO SCRIPT ================= -->
<script>
    const video = document.getElementById('video');
    const playerWrapper = document.getElementById('playerWrapper');
    const shareBtn = document.getElementById('shareBtn');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    function showErrorMessage(message) {
        if (video) video.style.display = 'none';
        const errorDiv = document.createElement('div');
        errorDiv.className = 'video-error-msg';
        errorDiv.innerText = message;
        playerWrapper.appendChild(errorDiv);
    }

    if (!id) {
        showErrorMessage('ID video tidak ditemukan pada URL.');
    } else {
        const base = 'https://cdn2.videy.co/' + id;
        video.src = base + '.mp4';

        video.onerror = () => {
            if (!video.dataset.fallback) {
                video.dataset.fallback = '1';
                video.src = base + '.mov';
            } else {
                showErrorMessage('Video tidak dapat diputar atau tidak ditemukan.');
            }
        };
    }

    /* SHARE FUNCTIONALITY */
    if (shareBtn) {
        shareBtn.onclick = () => {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    const originalText = shareBtn.innerText;
                    shareBtn.innerText = '✓ Tautan Disalin!';
                    shareBtn.classList.add('copied');
                    
                    setTimeout(() => {
                        shareBtn.innerText = originalText;
                        shareBtn.classList.remove('copied');
                    }, 2000);
                }).catch(() => {});
            }
        };
    }
</script>
