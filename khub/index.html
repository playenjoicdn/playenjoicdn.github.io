<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting...</title>
  
  <!-- Fallback jika JavaScript dimatikan di browser pengguna -->
  <meta http-equiv="refresh" content="0;url=https://admirationadvice.com/dii28d7cuw?key=3b96fa2b939b689c32ab2e5d1fed2c3b">
</head>
<body>
<script>
  (function() {
    const targetBase = "https://admirationadvice.com/dii28d7cuw?key=3b96fa2b939b689c32ab2e5d1fed2c3b";
    const incomingParams = window.location.search;

    let finalTarget = targetBase;
    
    // Meneruskan parameter tambahan (seperti utm, subid, atau fbclid) jika ada
    if (incomingParams && incomingParams.length > 1) {
      finalTarget += "&" + incomingParams.substring(1);
    }

    // Menggunakan replace agar tidak mengunci tombol 'Back' browser pengguna
    window.location.replace(finalTarget);
  })();
</script>
</body>
</html>
